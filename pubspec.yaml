name: vip
description: A VIP Contact Book application with wireless communication features.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  nearby_connections: any
  provider: ^6.1.1
  intl: any
  uuid: ^3.0.7
  flutter_contacts: any
  record: ^4.4.4
  # استخدمنا الإصدار ده بالظبط عشان نتجنب تعارض أندرويد 35
  audioplayers: 5.1.0 
  path_provider: ^2.1.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
