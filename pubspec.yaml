name: vip
description: A VIP Contact Book application with wireless communication features.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  nearby_connections: any
  provider: ^6.1.1
  intl: any
  uuid: ^4.3.3
  flutter_contacts: any
  record: any          # المكتبة دي لتسجيل الصوت
  audioplayers: any    # المكتبة دي لتشغيل الصوت
  path_provider: any   # المكتبة دي لحفظ الملفات الصوتية المؤقتة
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
